    <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      var toast = document.getElementById('pwa-toast');
      var timer = null;
      function show(text, sticky) {
        toast.textContent = text;
        toast.style.display = 'block';
        toast.style.opacity = '1';
        if (timer) clearTimeout(timer);
        if (!sticky) timer = setTimeout(hide, 4000);
      }
      function hide() { toast.style.opacity = '0'; setTimeout(function(){ toast.style.display='none'; }, 400); }

      navigator.serviceWorker.addEventListener('message', function (e) {
        var d = e.data || {};
        if (d.type === 'tile-progress') {
          show('\u{1F4E1} 离线地图缓存中 ' + d.done + '/' + d.total, true);
        } else if (d.type === 'tiles-done') {
          show(d.fail > 0
            ? '\u2705 离线就绪（' + (d.total - d.fail) + '/' + d.total + ' 块瓦片，' + d.fail + ' 块失败）'
            : '\u2705 离线地图已就绪（' + d.total + ' 块瓦片）');
        }
      });

      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js?v=20260912', { updateViaCache: 'none' }).catch(function () {
          show('\u26A0\uFE0F 离线缓存注册失败（需 https 或 localhost 环境）');
        });
      });
    })();
    </script>

    <script>
    // 侧栏折叠小耳朵按钮：贴在左侧栏右边缘，跟随宽度动画，点击切换收起/展开
    (function () {
      var tab = null;
      var sidebar = null;

      function findSidebar() {
        var divs = document.querySelectorAll('#root div');
        for (var i = 0; i < divs.length; i++) {
          var s = divs[i].getAttribute('style') || '';
          if (/width:\s*(380px|0px)/.test(s) && s.indexOf('transition') > -1 && s.indexOf('overflow') > -1) return divs[i];
        }
        return null;
      }

      function findNativeToggle() {
        var btns = document.querySelectorAll('button');
        for (var i = 0; i < btns.length; i++) {
          var t = btns[i].textContent || '';
          if (t.indexOf('清单/动线') > -1 || (t.indexOf('收起') > -1 && t.length < 12)) return btns[i];
        }
        return null;
      }

      function sync() {
        if (!sidebar || !tab) return;
        var w = sidebar.getBoundingClientRect().width;
        tab.style.left = w + 'px';
        var open = w > 30;
        tab.innerHTML = open ? '&#8249;' : '&#8250;';
        tab.title = open ? '收起左侧栏' : '展开清单/动线';
        var native = findNativeToggle();
        tab.className = native ? '' : 'hidden';
      }

      function init() {
        sidebar = findSidebar();
        if (!sidebar) return false;
        if (tab) return true;
        tab = document.createElement('button');
        tab.id = 'sidebar-toggle-tab';
        tab.setAttribute('aria-label', '折叠或展开左侧栏');
        tab.addEventListener('click', function () {
          var b = findNativeToggle();
          if (b) b.click();
        });
        document.body.appendChild(tab);
        if (window.ResizeObserver) new ResizeObserver(sync).observe(sidebar);
        window.addEventListener('resize', sync);
        window.addEventListener('orientationchange', sync);
        new MutationObserver(sync).observe(sidebar, { attributes: true, attributeFilter: ['style'] });
        sync();
        return true;
      }

      var tries = 0;
      var autoCollapsed = false;
      var timer = setInterval(function () {
        if (init() || ++tries > 200) clearInterval(timer);
        // 手机窄屏：首次加载自动收起侧栏，把全屏让给地图
        if (!autoCollapsed && window.innerWidth < 460 && sidebar) {
          autoCollapsed = true;
          if (sidebar.getBoundingClientRect().width > 300) {
            var b = findNativeToggle();
            if (b) b.click();
          }
        }
      }, 100);
    })();
    </script>
