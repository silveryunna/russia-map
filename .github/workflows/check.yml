# 推送即质量门禁：数据完整性 + 校验器变异测试 + 打包产物 ESM 解析 + 版本同步 + 页面冒烟
name: quality-gate
on: [push]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 版本同步检查需要比对推送区间
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1) 点位/动线数据完整性（部署仓库根目录的 data/ 即线上数据）
      - name: 数据校验
        run: node tools/check-data.mjs ./data

      # 1.5) 莫斯科样板数据契约（ROADMAP 附录 C）：排程字段齐全，unknown 必须显式写出
      - name: 样板数据契约
        run: node tools/check-sample-data.mjs ./data

      # 1.6) 城市排程字段：非 pending 点位必须有坐标、停留时长与依据
      - name: 城市排程字段
        run: |
          for city in 三亚 哈尔滨 伊宁 圣彼得堡 叶卡捷琳堡 阿拉木图 莫斯科州/近郊 其他城市; do
            node tools/check-city-duration.mjs ./data "$city"
          done

      # 2) 校验器本身不能退化：32 个变异必须全部捕获
      - name: 变异测试
        run: |
          node tools/mutation-test.mjs . mut-report.tsv | tee mut.log
          if grep -q '❌' mut.log; then echo '校验器漏检变异'; exit 1; fi

      # 2.5) 坐标变换质量门：往返一致性 + coordtransform 基准 + §7.9 实测交叉核对
      - name: 坐标变换测试
        run: node tools/coords-test.mjs

      # 2.6) 计划模块：规则引擎（跨动线去重/单日上限/天数一致）+ localStorage 容错
      - name: 计划模块测试
        run: |
          node tools/test-plan-engine.mjs
          node tools/test-plan-store.mjs

      # 2.7) Trip v2：schema 契约、旧计划/打卡迁移（零丢失 + 歧义队列）、编辑操作、存储与导入
      - name: Trip v2 测试
        run: |
          node tools/test-trip-schema.mjs
          node tools/test-trip-migrate.mjs
          node tools/test-trip-edit.mjs
          node tools/test-trip-store.mjs

      # 2.7.1) P2 可行性引擎：硬约束、未知时间处理、修复建议、确定性 + 时间轴几何 + 自动减负 + 软目标 + Plan B + 顺序求解 + 真实动线验收
      - name: 可行性引擎测试
        run: |
          node tools/test-feasibility.mjs
          node tools/test-timeline-view.mjs
          node tools/test-repair.mjs
          node tools/test-soft.mjs
          node tools/test-alternatives.mjs
          node tools/test-solver.mjs
          node tools/test-fare-table.mjs
          node tools/check-route-feasibility.mjs ./data

      # 2.8) SW 缓存策略：外壳覆盖全部页面 + 瓦片白名单与实际底图一致
      - name: SW 策略测试
        run: node tools/sw-policy-test.mjs

      # 2.9) 文档事实：README/AGENTS 里的数量与代码、数据一致（防"21 变异"这类过期数字）
      - name: 文档事实检查
        run: node tools/check-doc-facts.mjs

      # 3) 打包产物必须能通过严格 ESM 解析（node --check 不可靠，白屏事故防线）
      - name: ESM 严格解析
        run: node --experimental-vm-modules tools/check-esm.mjs

      # 3.5) src 与已提交产物一致性（多会话纪律：改 src 必须经 publish 一起带产物；
      #      顺带验证了源码可复现构建——npm ci + vite build 在 CI 能跑通）
      - name: src/产物一致性 + 可复现构建
        run: |
          npm ci
          node tools/check-build-sync.mjs

      # 4) assets/*.js 变更必须同提交改 sw.js（VERSION 随 publish 自动注入新 sha，
      #    保证 SW 激活清旧缓存）。P4 起产物为哈希文件名，旧的 ?v= 具名规则已废除。
      - name: 版本同步检查
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo '新分支首个推送，跳过'; exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          assets_js=$(echo "$changed" | grep '^assets/.*\.js$' | grep -v 'tdt-key' || true)
          if [ -z "$assets_js" ]; then echo '✅ 无受控 JS 变更'; exit 0; fi
          echo "$changed" | grep -q '^sw\.js$' || { echo '❌ assets/*.js 变更须同提交改 sw.js（应通过 npm run publish 发布，它会自动处理）'; exit 1; }
          echo '✅ 版本同步检查通过'

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装 Playwright（仓库外）
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y >/dev/null 2>&1
          npm i playwright@1.49.1 --no-fund --no-audit
          npx playwright install --with-deps chromium
      - name: 启动静态服务并冒烟
        env:
          SMOKE_DEPS: /tmp/smoke
        run: |
          python3 -m http.server 8080 >/dev/null 2>&1 &
          sleep 2
          node tools/smoke-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: smoke-*.png
          retention-days: 14
