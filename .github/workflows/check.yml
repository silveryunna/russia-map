# 推送即质量门禁：数据完整性 + 校验器变异测试 + 打包产物 ESM 解析 + 版本同步 + 页面冒烟
name: quality-gate
on: [push]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 版本同步检查需要比对推送区间
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1) 点位/动线数据完整性（部署仓库根目录的 data/ 即线上数据）
      - name: 数据校验
        run: node tools/check-data.mjs ./data

      # 2) 校验器本身不能退化：26 个变异必须全部捕获
      - name: 变异测试
        run: |
          node tools/mutation-test.mjs . mut-report.tsv | tee mut.log
          if grep -q '❌' mut.log; then echo '校验器漏检变异'; exit 1; fi

      # 3) 打包产物必须能通过严格 ESM 解析（node --check 不可靠，白屏事故防线）
      - name: ESM 严格解析
        run: node --experimental-vm-modules tools/check-esm.mjs

      # 3.5) 源码可复现构建（P2 起 src/ 是源码事实来源，防"本地能建 CI 建不了"）
      - name: 源码构建验证
        run: |
          npm ci
          npm run build

      # 4) 改了 assets/*.js 必须同提交同步对应页面的 ?v= 与 sw.js VERSION
      #    页面专属资产 → 对应 HTML；共享/核心资产 → map.html；任何 JS 变更都要 bump sw.js
      - name: 版本同步检查
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo '新分支首个推送，跳过'; exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          assets_js=$(echo "$changed" | grep '^assets/.*\.js$' | grep -v 'tdt-key' || true)
          if [ -z "$assets_js" ]; then echo '✅ 无受控 JS 变更'; exit 0; fi
          fail=0
          need() {
            # $1=资产正则  $2=需要的文件(空格分隔)  $3=说明
            if echo "$assets_js" | grep -qE "$1"; then
              for f in $2; do
                echo "$changed" | grep -q "^${f}\$" || { echo "❌ $3（缺 $f）"; fail=1; }
              done
            fi
          }
          need 'account-v1\.js$'   'account.html'                'account-v1.js 变更须同步 account.html ?v='
          need 'friend-v1\.js$'    'friend.html'                 'friend-v1.js 变更须同步 friend.html ?v='
          need 'plan-v1\.js$'      'plan.html'                   'plan-v1.js 变更须同步 plan.html ?v='
          need 'notes-v2\.js$'     'notes.html'                  'notes-v2.js 变更须同步 notes.html ?v='
          need 'album-[^/]*\.js$'  'album.html'                  'album 资产变更须同步 album.html ?v='
          need 'list-[^/]*\.js$'   'list.html'                   'list 资产变更须同步 list.html ?v='
          need 'ai-models-v1\.js$' 'account.html friend.html' 'ai-models-v1.js 是 friend/account 的共享依赖（plan-v1.js 无 import，不消费）'
          core=$(echo "$assets_js" | grep -vE '(account-v1|friend-v1|plan-v1|notes-v2|ai-models-v1)\.js$|album-[^/]*\.js$|list-[^/]*\.js$' || true)
          if [ -n "$core" ]; then
            echo "$changed" | grep -q '^map\.html$' || { echo "❌ 核心/地图资产变更须同步 map.html ?v=：$core"; fail=1; }
          fi
          echo "$changed" | grep -q '^sw\.js$' || { echo '❌ 任何 JS 变更都须 bump sw.js VERSION'; fail=1; }
          [ "$fail" = 0 ] && echo '✅ 版本同步检查通过' || exit 1

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装 Playwright（仓库外）
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y >/dev/null 2>&1
          npm i playwright@1.49.1 --no-fund --no-audit
          npx playwright install --with-deps chromium
      - name: 启动静态服务并冒烟
        env:
          SMOKE_DEPS: /tmp/smoke
        run: |
          python3 -m http.server 8080 >/dev/null 2>&1 &
          sleep 2
          node tools/smoke-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: smoke-*.png
          retention-days: 14
