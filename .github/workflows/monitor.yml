# 站外合成监控：每 6 小时探测腾讯云+Pages 双节点，故障自动开 issue，恢复自动关闭
# 注意：GitHub 会在仓库 60 天无活动后停用定时任务，届时手动 workflow_dispatch 一次或随便推个提交即可重新激活
name: site-monitor
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 探测双节点
        run: node tools/site-monitor.mjs | tee monitor-report.md
        continue-on-error: true
      - name: 故障开 issue / 恢复关 issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('monitor-report.md', 'utf8');
            const failed = report.includes('FAIL');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 50 });
            const open = issues.filter(i => i.title.includes('站点监控告警') && !i.pull_request);
            const body = '```\n' + report.slice(0, 5000) + '\n```';
            if (failed && !open.length) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `🚨 站点监控告警 ${new Date().toISOString().slice(0, 16)}Z`, body });
              core.setFailed('监控发现故障，已开 issue');
            } else if (failed && open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body: '仍未恢复：\n' + body });
              core.setFailed('监控发现故障（已有未关闭 issue）');
            } else if (!failed && open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body: '已恢复 ✅\n' + body });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, state: 'closed' });
            } else {
              console.log('一切正常');
            }
